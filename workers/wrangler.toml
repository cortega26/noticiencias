name = "noticiencias-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = false

# Account ID is passed via CLOUDFLARE_ACCOUNT_ID env var in CI.
# For local dev, set it in a .dev.vars file or pass via --account-id.

# Route pattern: the whole zone. Needed because article permalinks have
# no fixed prefix (see docs/adr/0008-markdown-for-agents.md) — some
# resolve to bare root-level slugs, so /api/*-only routing can't reach
# every article for Accept: text/markdown negotiation. The fetch handler
# still passes through unchanged to GitHub Pages for every request that
# isn't /api/* or an explicit Markdown-negotiation match.
routes = [
  { pattern = "noticiencias.com/*", zone_name = "noticiencias.com" }
]

[observability]
enabled = true
head_sampling_rate = 1

# ---------------------------------------------------------------------------
# Production environment
# ---------------------------------------------------------------------------
[env.production]
vars = { ENVIRONMENT = "production" }

# R2 bucket for storing form submissions (optional — create the bucket first)
[[env.production.r2_buckets]]
binding = "REPORT_BUCKET"
bucket_name = "noticiencias-reports"

# KV namespace for pipeline status (optional — create the namespace first)
# [[env.production.kv_namespaces]]
# binding = "STATUS_KV"
# id = ""

# KV namespace for report-endpoint rate limiting + idempotency
# (created with `wrangler kv namespace create RATE_LIMIT_KV`)
[[env.production.kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6415b0f627c84edaaab4e4a9f6e89e2c"

# ---------------------------------------------------------------------------
# Preview environment (for wrangler dev / staging)
# ---------------------------------------------------------------------------
[env.preview]
vars = { ENVIRONMENT = "preview" }
