site:
  name: 'Noticiencias'
  site: 'https://noticiencias.com'
  base: '/'
  # Plan 031 (2026-08-11): trailing-slash investigation concluded — the
  # production host serves the slash form as canonical (301s no-slash
  # routes to them, 200 on /buscar/, /blog/, /categorias/*, /temas/*),
  # and the site's own nav links are authored in slash form. The previous
  # `false` made the local build 404 on every slash-form route and emit
  # no-slash canonical tags, diverging from the deployed site.
  trailingSlash: true

  googleSiteVerificationId: ''

metadata:
  title:
    default: 'Noticiencias'
    template: '%s | Noticiencias'
  description: 'Traduce ciencia, tecnología e internet de interés público a un español claro para 580 millones de hispanohablantes.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: 'Noticiencias'
    images:
      - url: '~/assets/images/default.png'
        width: 1200
        height: 628
    type: website
  twitter:
    handle: '@noti_ciencias'
    site: '@noti_ciencias'
    cardType: summary_large_image

i18n:
  language: es
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6

    post:
      isEnabled: true
      permalink: '/%category%/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'categorias' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'temas' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: true

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      # GA4 + Consent Mode v2 advanced (plan 009, ADR-0012). Null = OFF.
      id: 'G-BP9KG11S3W'
    # Cloudflare Web Analytics beacon (plan 007, ADR-0011), cookieless
    # baseline kept alongside GA4 (ADR-0012). The token comes from the
    # dashboard "Manage site" snippet (manual JS snippet installation) and is
    # public — it ships in every page. Tracking is OFF while null.
    cloudflare:
      token: '27d6606f22c945c597c080a43bdbf415'

form:
  # Report-a-problem endpoint. Enabled after the Worker's durable sink
  # (R2 bucket noticiencias-reports) was provisioned and verified live
  # (plan 023, 2026-08-11): POST -> 201 with report id, idempotent retries.
  endpoint: 'https://noticiencias.com/api/report'
  # Newsletter capture endpoint — deliberately separate from the report
  # endpoint (the two forms have different wire contracts). Wired to
  # Buttondown (plan 008, ADR-0009, 2026-09-16): plain-HTML form POST,
  # single "email" field, double opt-in on by default, open/click
  # tracking left off. Operator-supplied username; billing and Friday
  # send owned by Carlos Ortega. Sending domain: Buttondown subdomain
  # (no custom-domain DNS configured).
  newsletter_endpoint: 'https://buttondown.com/api/emails/embed-subscribe/noticiencias'

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
