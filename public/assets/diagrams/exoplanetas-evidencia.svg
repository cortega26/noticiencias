<svg xmlns="http://www.w3.org/2000/svg" width="450" height="790" viewBox="0 0 450 790" role="img" aria-labelledby="title desc"><title id="title">Cuatro preguntas sobre una señal de exoplaneta</title><desc id="desc">Planeta, atmósfera, moléculas y origen biológico son hipótesis diferentes. Cada una necesita datos y evaluación de alternativas.</desc><rect width="450" height="790" fill="#f4f1e9"/><g font-family="system-ui,sans-serif" fill="#173d36"><text x="24" y="37" font-size="23" font-weight="700">Una señal no resuelve</text><text x="24" y="66" font-size="23" font-weight="700">todas las preguntas.</text>
<g fill="#fff" stroke="#215a50" stroke-width="2"><rect x="24" y="100" width="402" height="120" rx="6"/><rect x="24" y="245" width="402" height="120" rx="6"/><rect x="24" y="390" width="402" height="135" rx="6"/><rect x="24" y="550" width="402" height="120" rx="6"/></g>
<g font-size="22" font-weight="700"><text x="42" y="134">1. ¿Hay un planeta?</text><text x="42" y="279">2. ¿Hay una atmósfera?</text><text x="42" y="424">3. ¿Qué moléculas</text><text x="42" y="452">explican el espectro?</text><text x="42" y="584">4. ¿La explicación</text><text x="42" y="612">requiere vida?</text></g><g font-size="18"><text x="42" y="170">Repetir la señal y comprobar</text><text x="42" y="195">otras explicaciones.</text><text x="42" y="315">Separar la señal del planeta</text><text x="42" y="340">y la actividad estelar.</text><text x="42" y="484">Comparar modelos y bandas</text><text x="42" y="509">que pueden superponerse.</text><text x="42" y="644">Evaluar orígenes no biológicos.</text></g><g font-size="16"><text x="24" y="711">Cada conclusión exige evidencia adicional.</text><text x="24" y="736">No es una escala de probabilidad.</text><text x="24" y="763">Noticiencias · NASA / Catling / Meadows</text></g></g></svg>
