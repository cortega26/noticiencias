<svg xmlns="http://www.w3.org/2000/svg" width="450" height="790" viewBox="0 0 450 790" role="img" aria-labelledby="title desc">
<title id="title">Entradas, depósitos y salidas de carbono</title><desc id="desc">La fotosíntesis lleva carbono a las plantas; las plantas lo transfieren a raíces, hongos y suelo. La respiración y las perturbaciones pueden devolverlo a la atmósfera. Las flechas no están a escala.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#215a50"/></marker></defs>
<rect width="450" height="790" fill="#f4f1e9"/><g font-family="system-ui,sans-serif" fill="#173d36"><text x="24" y="37" font-size="23" font-weight="700">El carbono circula.</text><text x="24" y="66" font-size="23" font-weight="700">¿Cuánto permanece?</text>
<g fill="#fff" stroke="#215a50" stroke-width="2"><rect x="24" y="100" width="330" height="64" rx="6"/><rect x="24" y="220" width="330" height="75" rx="6"/><rect x="24" y="365" width="330" height="75" rx="6"/><rect x="24" y="510" width="330" height="85" rx="6"/></g>
<g font-size="22" text-anchor="middle"><text x="189" y="140">CO₂ en la atmósfera</text><text x="189" y="249">Plantas</text><text x="189" y="278" font-size="18">Carbono en biomasa</text><text x="189" y="396">Raíces y hongos</text><text x="189" y="424" font-size="18">Transferencia de carbono</text><text x="189" y="541">Materia orgánica del suelo</text><text x="189" y="575" font-size="18">Depósito que cambia</text></g>
<g fill="none" stroke="#215a50" stroke-width="3" marker-end="url(#arrow)"><path d="M189 165V210"/><path d="M189 296V355"/><path d="M189 441V500"/><path d="M355 550H410V130H362"/></g>
<g font-size="18"><text x="35" y="199">Fotosíntesis</text><text x="35" y="325">Compuestos</text><text x="35" y="348">orgánicos</text><text x="35" y="480">Aportes al suelo</text><text transform="translate(399 465) rotate(-90)">Retorno: respiración y perturbaciones</text></g>
<g font-size="20" font-weight="700"><text x="24" y="642">Cambio del depósito:</text><text x="24" y="670">entradas − salidas</text></g><g font-size="16"><text x="24" y="714">Esquema cualitativo · Noticiencias</text><text x="24" y="739">Las flechas no indican magnitudes.</text><text x="24" y="764">Hawkins et al. 2023 / IPCC AR6</text></g></g></svg>
