name: Generate Content Metrics

on:
  schedule:
    # Daily at 06:17 UTC (off-peak)
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # 25 min: checkout + npm ci (~2-3 min) plus the 15-min PR-check poll loop
    # in scripts/ci-land-bot-pr.sh (runner queue delays can push Content Guard
    # far past the PR creation time).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate metrics
        run: node scripts/generate-metrics.js

      - name: Bypass git hooks for bot commit
        # Husky pre-commit/pre-push hooks are for human pushes; the bot commit
        # must not run lint-staged or the full validation chain on the runner.
        run: git config core.hooksPath /dev/null

      - name: Warn when bot PAT is not configured
        env:
          GH_TOKEN: ${{ secrets.NOTICIENCIAS_BOT_TOKEN || '' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::NOTICIENCIAS_BOT_TOKEN secret is not configured - bot PRs fall back to GITHUB_TOKEN and are gated by GitHub bot-approval (checks conclude action_required and never run). Configure the fine-grained PAT to enable self-serve landing."
          fi
      - name: Commit and land metrics
        # Direct pushes to main are rejected by branch protection; land via PR
        # (scripts/ci-land-bot-pr.sh merges once Content Guard passes).
        #
        # GH_TOKEN uses NOTICIENCIAS_BOT_TOKEN (fine-grained PAT with
        # contents: write + pull-requests: write on this repo) when set:
        # events triggered by the plain GITHUB_TOKEN are gated by GitHub's
        # bot-approval mechanism — pull_request workflows on bot-created PRs
        # conclude `action_required` with zero jobs and never run, so bot PRs
        # could never validate or merge. A PAT-credited push/PR is attributed
        # to a human and runs ungated. Falls back to GITHUB_TOKEN when the
        # secret is not configured.
        env:
          GH_TOKEN: ${{ secrets.NOTICIENCIAS_BOT_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Self-cleanup: the bot exits 1 when checks fail or the merge times
          # out and leaves the PR open; close any stale bot PRs from previous
          # failed runs and delete their branches so debris cannot accumulate.
          while IFS=$'\t' read -r pr_number branch_name; do
            gh pr close "$pr_number" --comment "Superseded by a newer metrics run." || true
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch_name}" -X DELETE --silent || true
          done < <(gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("ci/metrics-")) | [.number, .headRefName] | @tsv' 2>/dev/null || true)
          git add data/metrics/pipeline-metrics.json
          if git diff --cached --quiet; then
            echo "Metrics already up to date."
            exit 0
          fi
          git commit -m "chore: update pipeline metrics"
          BRANCH="ci/metrics-$(date -u +%Y%m%dT%H%M%SZ)"
          if [ -n "$GH_TOKEN" ]; then
            git push -u "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
          else
            git push -u origin "HEAD:$BRANCH"
          fi
          bash scripts/ci-land-bot-pr.sh "$BRANCH" "chore: update pipeline metrics"
