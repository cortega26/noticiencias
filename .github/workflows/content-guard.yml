name: Content Guard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: content-guard-${{ github.ref }}
  cancel-in-progress: true

env:
  BACKEND_CONTRACT_REPOSITORY: cortega26/noticiencias_news_collector
  BACKEND_CONTRACT_REF: main
  BACKEND_CONTRACT_SCHEMA_PATH: news_collector/contracts/frontend_schema.py

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Full history: the failure-path callback below diffs against the
          # PR base / pre-push commit to derive publication_ids, which a
          # shallow (default depth-1) checkout wouldn't have available.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: 🧹 Lint (ESLint + Prettier)
        run: npm run lint

      - name: 📦 Dependency Graph (peer validity)
        # Plan 032: fail the build if any production dependency declares an
        # invalid peer range. `npm ls --omit=dev` exits non-zero on invalid peers.
        run: npm ls --omit=dev

      - name: 🔍 Frontmatter & Type Validation
        run: npm run validate:content

      - name: Checkout back-end schema (sparse)
        id: backend_checkout
        # Secrets are not available in fork or Dependabot PRs
        if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.fork == false && github.actor != 'dependabot[bot]') }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ env.BACKEND_CONTRACT_REPOSITORY }}
          ref: ${{ env.BACKEND_CONTRACT_REF }}
          token: ${{ secrets.NOTICIENCIAS_BACKEND_READ_TOKEN }}
          path: _backend_sparse
          sparse-checkout: |
            news_collector/contracts/frontend_schema.py
          sparse-checkout-cone-mode: false

      - name: 🔗 Contract Parity Gate
        # Always runs: uses live backend schema when available, falls back to committed snapshot
        run: |
          LIVE_SCHEMA="_backend_sparse/${{ env.BACKEND_CONTRACT_SCHEMA_PATH }}"
          SNAPSHOT=".contract-snapshots/frontend_schema.snapshot.json"

          if [ -f "$LIVE_SCHEMA" ]; then
            echo "::notice::Using live backend schema from sparse checkout."
            BACKEND_SCHEMA_PATH="$LIVE_SCHEMA" npm run check:contract-sync
          elif [ -f "$SNAPSHOT" ]; then
            echo "::warning::Backend schema not available (fork/Dependabot?). Using committed snapshot."
            node scripts/check-contract-sync.js --snapshot "$SNAPSHOT" src/content.config.ts
          else
            echo "::error::Neither live backend schema nor snapshot found. Cannot verify contract parity."
            exit 1
          fi

      - name: 🔗 Link Checker
        uses: lycheeverse/lychee-action@7cd0af4c74a61395d455af97419279d86aafaede # v2.0.2
        with:
          # Retries ride through transient HTTP 429 rate limits; security.googleblog.com
          # is excluded because Google persistently rate-limits runner IPs.
          args: --no-progress --max-retries 3 --retry-wait-time 10 --exclude scientificamerican.com --exclude techxplore.com --exclude nasa.gov --exclude www.nasa.gov --exclude security.googleblog.com './src/content/**/*.md'
          fail: true

      - name: 📣 Notify Backend on Validation Failure
        if: failure()
        env:
          BACKEND_WEBHOOK_URL: ${{ secrets.BACKEND_WEBHOOK_URL }}
          BACKEND_WEBHOOK_TOKEN: ${{ secrets.BACKEND_WEBHOOK_TOKEN }}
          GITHUB_BASE_SHA: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          echo '{"check":"content-guard","status":"fail","message":"One or more validation steps failed. See run for details."}' > /tmp/guard-failure.json
          node --input-type=module <<'EOF' > /tmp/guard-failure-ids.json
          import { getChangedPostRefineryIds } from './scripts/utils/publication-ids.js';
          const ids = getChangedPostRefineryIds({
            baseSha: process.env.GITHUB_BASE_SHA,
            headSha: process.env.GITHUB_SHA,
            repoRoot: process.cwd(),
          });
          console.log(JSON.stringify(ids));
          EOF
          node scripts/backend-notify.js --status=fail --payload-file=/tmp/guard-failure.json --publication-ids-file=/tmp/guard-failure-ids.json || true

  build:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Astro image cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: node_modules/.astro
          key: >-
            ${{ runner.os }}-astro-images-v2-${{ hashFiles('package-lock.json', 'astro.config.mjs',
            'src/components/common/Image.astro', 'src/utils/images.ts',
            'src/utils/images-optimization.ts') }}-${{ hashFiles('src/assets/images/**') }}
          restore-keys: |
            ${{ runner.os }}-astro-images-v2-${{ hashFiles('package-lock.json', 'astro.config.mjs', 'src/components/common/Image.astro', 'src/utils/images.ts', 'src/utils/images-optimization.ts') }}-
            ${{ runner.os }}-astro-images-v2-

      - name: 🏗️ Build Frontend
        run: npm run build

      - name: 🧪 Dist Sanity
        run: npm run test:dist

      - name: ✅ Unit Coverage (honest denominator, no-regression thresholds)
        run: npm run test:coverage

      - name: Install Worker dependencies
        # The Worker has its own package.json/lockfile; the pool-based suite
        # needs its node_modules installed before it can run.
        working-directory: workers
        run: npm ci

      - name: ⚙️ Worker suite (fetch-boundary + coverage, workerd runtime)
        # Plan 031 Step 3/4: the Worker tests run inside the real workerd
        # runtime via @cloudflare/vitest-pool-workers (fetch routing, CORS,
        # R2/KV bindings) with coverage thresholds — the deploy-worker gate
        # also runs them on workers/** changes.
        working-directory: workers
        run: npm run test:coverage

      - name: Restore Playwright browser cache
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: 🎭 Browser Suite (local build only — never the live site)
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:4321
        run: npx playwright test --project=mobile-375 --project=desktop-1280

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          # Traces/screenshots of the local build's DOM/network only — no
          # report-form submissions are ever sent to a real endpoint in
          # these tests (mocked via page.route), so nothing here can leak
          # real report contents or secrets.
          path: |
            playwright-report/
            test-results/
          retention-days: 7
