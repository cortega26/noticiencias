name: Cloudflare Web Analytics — provision (manual)

# Plan 009 phase 2. One-off, operator-triggered: checks whether
# CLOUDFLARE_API_TOKEN may manage Web Analytics and, only when `create` is
# true, registers noticiencias.com and prints the beacon token.
#
# The beacon token is NOT a secret (it ships in every page's HTML), so it is
# written to the job summary. The API token is never echoed.
#
# Dry run by default: with `create: false` it only lists existing sites.

on:
  workflow_dispatch:
    inputs:
      create:
        description: 'Register noticiencias.com if it is not registered yet'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_HOST: noticiencias.com
      CREATE: ${{ inputs.create }}
    steps:
      - name: Check inputs
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set as repository secrets."
            exit 1
          }

      - name: List Web Analytics sites (read-only permission probe)
        id: list
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/rum/site_info/list"
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" -o list.json
          ok=$(jq -r '.success' list.json)
          if [ "$ok" != "true" ]; then
            {
              echo "### Web Analytics: token cannot list sites"
              echo
              echo "Cloudflare answered: \`$(jq -c '.errors' list.json)\`"
              echo
              echo "The token needs **Account → Web Analytics → Edit** (or Read for the dry run)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::CLOUDFLARE_API_TOKEN cannot access Web Analytics (see job summary)."
            exit 1
          fi
          jq -r --arg h "$SITE_HOST" '[.result[]? | select(.host == $h)] | length' list.json > count.txt
          echo "existing=$(cat count.txt)" >> "$GITHUB_OUTPUT"
          {
            echo "### Web Analytics sites in the account"
            jq -r '.result[]? | "- `\(.host)` (site_tag `\(.site_tag)`)"' list.json
            [ "$(jq '.result | length' list.json)" = "0" ] && echo "_none_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Register the site (only when requested and absent)
        if: ${{ inputs.create && steps.list.outputs.existing == '0' }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/rum/site_info"
          curl -sS -X POST -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"host\":\"${SITE_HOST}\",\"auto_install\":false}" "$api" -o create.json
          if [ "$(jq -r '.success' create.json)" != "true" ]; then
            echo "::error::Create failed: $(jq -c '.errors' create.json)"
            exit 1
          fi
          {
            echo "### Registered \`${SITE_HOST}\`"
            echo
            echo "Beacon token (public, goes in \`src/config.yaml\` → \`analytics.vendors.cloudflare.token\`):"
            echo
            echo "\`$(jq -r '.result.site_token' create.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Site already registered — print its token
        if: ${{ inputs.create && steps.list.outputs.existing != '0' }}
        run: |
          {
            echo "### \`${SITE_HOST}\` is already registered"
            echo
            echo "Beacon token (public):"
            echo
            echo "\`$(jq -r --arg h "$SITE_HOST" '[.result[] | select(.host == $h)][0].site_token' list.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"
