name: Performance Monitor

on:
  schedule:
    # Monthly on the 15th at 09:37 UTC
    - cron: '37 9 15 * *'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    # The production build alone now takes ~9.5 min (323 s on 2026-10-15, 566 s on
    # 2026-10-21 and growing with the article count); 10 min cancelled the audit step.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse
        run: npm install -g lighthouse

      - name: Build site
        run: npm run build
        env:
          IMAGE_DERIVATIVES_REQUIRE_URL: 0
          IMAGE_DERIVATIVES_STRICT: 0

      - name: Serve and audit
        run: |
          mkdir -p reports
          npx --yes serve dist -p 4173 &
          sleep 3

          lighthouse http://localhost:4173 \
            --output=json \
            --output-path=reports/lighthouse-home.json \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,seo,best-practices

          # Extract scores
          PERF=$(node -e "const r=require('./reports/lighthouse-home.json'); console.log(Math.round(r.categories.performance.score*100))")
          A11Y=$(node -e "const r=require('./reports/lighthouse-home.json'); console.log(Math.round(r.categories.accessibility.score*100))")
          SEO=$(node -e "const r=require('./reports/lighthouse-home.json'); console.log(Math.round(r.categories.seo.score*100))")
          BP=$(node -e "const r=require('./reports/lighthouse-home.json'); console.log(Math.round(r.categories['best-practices'].score*100))")

          echo "Performance: ${PERF}"
          echo "Accessibility: ${A11Y}"
          echo "SEO: ${SEO}"
          echo "Best Practices: ${BP}"

          echo "LIGHTHOUSE_SCORES=P=${PERF} A=${A11Y} S=${SEO} B=${BP}" >> $GITHUB_ENV

          # Alert if any score is below 80
          if [ "$PERF" -lt 80 ] || [ "$A11Y" -lt 80 ] || [ "$SEO" -lt 80 ] || [ "$BP" -lt 80 ]; then
            echo "::warning::Lighthouse scores below threshold: P=${PERF} A=${A11Y} S=${SEO} B=${BP}"
            echo "LOW_SCORES=true" >> $GITHUB_ENV
          fi

          kill %1 || true

      - name: Open, update or close the Lighthouse issue
        # Runs on every successful audit so a recovery closes the issue and a
        # repeated low score updates the open one instead of filing a duplicate.
        uses: actions/github-script@e69ef5462fd455e02edcaf4dd7708eda96b9eda0 # v7.0.0
        with:
          script: |
            const { syncLighthouseIssue } = require(`${process.env.GITHUB_WORKSPACE}/scripts/perf-monitor-issue.cjs`);
            await syncLighthouseIssue({
              github,
              context,
              scores: process.env.LIGHTHOUSE_SCORES,
              low: process.env.LOW_SCORES === 'true',
            });
