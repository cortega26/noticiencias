name: Sync Image Derivatives Manifest

on:
  push:
    branches:
      - 'content/update-*'
    paths:
      - 'src/content/posts/**'
      - 'src/assets/images/**'

permissions:
  contents: write

jobs:
  sync-manifest:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # A GITHUB_TOKEN push is gated by GitHub bot-approval: the follow-up
          # checks conclude action_required and never run. Use the bot PAT so
          # the manifest commit triggers normal workflows on content branches.
          token: ${{ secrets.NOTICIENCIAS_BOT_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish image derivatives manifest
        run: npm run publish:image-derivatives

      - name: Warn when bot PAT is not configured
        env:
          BOT_TOKEN: ${{ secrets.NOTICIENCIAS_BOT_TOKEN }}
        run: |
          if [ -z "$BOT_TOKEN" ]; then
            echo "::warning::NOTICIENCIAS_BOT_TOKEN is not configured - the manifest commit will use GITHUB_TOKEN and its checks will conclude action_required and never run."
          fi

      - name: Commit manifest update when needed
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/image-derivatives-manifest.json
          if git diff --cached --quiet; then
            echo "Image derivatives manifest already up to date."
            exit 0
          fi
          git commit -m "chore: sync image derivatives manifest"
          git push origin "HEAD:$TARGET_BRANCH"
