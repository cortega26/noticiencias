name: Debug Watchdog Query
on:
  push:

permissions:
  actions: read

jobs:
  dbg:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Debug run list query
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "GH_TOKEN set: $([ -n "$GH_TOKEN" ] && echo yes || echo no)"
          gh --version
          echo "--- gh run list (name) ---"
          gh run list --workflow="Generate Content Metrics" --limit 1 --json databaseId,updatedAt
          echo "exit: $?"
          echo "--- gh run list (file) ---"
          gh run list --workflow="generate-metrics.yml" --limit 1 --json databaseId,updatedAt
          echo "exit: $?"
          echo "--- gh api raw ---"
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/generate-metrics.yml/runs?per_page=1" --jq '.total_count, (.workflow_runs[0].updated_at // "none")'
          echo "exit: $?"
