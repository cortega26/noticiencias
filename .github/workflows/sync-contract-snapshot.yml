name: Sync Contract Snapshot

on:
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-snapshot:
    runs-on: ubuntu-latest
    # 25 min: checkout + npm ci (~2-3 min) plus the 15-min PR-check poll loop
    # in scripts/ci-land-bot-pr.sh (runner queue delays can push Content Guard
    # far past the PR creation time).
    timeout-minutes: 25
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout back-end schema (sparse)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: cortega26/noticiencias_news_collector
          ref: main
          token: ${{ secrets.NOTICIENCIAS_BACKEND_READ_TOKEN }}
          path: _backend_sparse
          sparse-checkout: |
            news_collector/contracts/frontend_schema.py
          sparse-checkout-cone-mode: false

      - name: Generate contract snapshot
        run: |
          BACKEND_SCHEMA_PATH="_backend_sparse/news_collector/contracts/frontend_schema.py" \
            npm run sync:contract-snapshot

      - name: Warn when bot PAT is not configured
        env:
          GH_TOKEN: ${{ secrets.NOTICIENCIAS_BOT_TOKEN || '' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::NOTICIENCIAS_BOT_TOKEN secret is not configured - bot PRs fall back to GITHUB_TOKEN and are gated by GitHub bot-approval (checks conclude action_required and never run). Configure the fine-grained PAT to enable self-serve landing."
          fi
      - name: Commit and land snapshot update if changed
        # Direct pushes to main are rejected by branch protection (required
        # checks validate + build), so land the snapshot through a PR
        # (scripts/ci-land-bot-pr.sh merges it once Content Guard passes).
        # Hooks are bypassed: the husky pre-push hook runs the full
        # validate:content chain (incl. the flaky link check) on the runner
        # and would abort the bot push.
        #
        # GH_TOKEN uses NOTICIENCIAS_BOT_TOKEN (fine-grained PAT with
        # contents: write + pull-requests: write on this repo) when set:
        # events triggered by the plain GITHUB_TOKEN are gated by GitHub's
        # bot-approval mechanism — pull_request workflows on bot-created PRs
        # conclude `action_required` with zero jobs and never run, so bot PRs
        # could never validate or merge. A PAT-credited push/PR is attributed
        # to a human and runs ungated. Falls back to GITHUB_TOKEN when the
        # secret is not configured.
        env:
          GH_TOKEN: ${{ secrets.NOTICIENCIAS_BOT_TOKEN || github.token }}
        run: |
          git config core.hooksPath /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Self-cleanup: the bot exits 1 when checks fail or the merge times
          # out and leaves the PR open; close any stale bot PRs from previous
          # failed runs and delete their branches so debris cannot accumulate.
          while IFS=$'\t' read -r pr_number branch_name; do
            gh pr close "$pr_number" --comment "Superseded by a newer sync run." || true
            gh api "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch_name}" -X DELETE --silent || true
          done < <(gh pr list --base main --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("sync/contract-snapshot-")) | [.number, .headRefName] | @tsv' 2>/dev/null || true)
          git add .contract-snapshots/frontend_schema.snapshot.json
          if git diff --cached --quiet; then
            echo "Contract snapshot already up to date."
            exit 0
          fi
          git commit -m "chore: sync contract schema snapshot"
          BRANCH="sync/contract-snapshot-$(date -u +%Y%m%dT%H%M%SZ)"
          # Push with the configured token (PAT when set) so the head commit
          # is credited to a human, not github-actions[bot]. Without this the
          # branch protection can treat the bot push as a workflow-triggering
          # action and gate the checks.
          if [ -n "$GH_TOKEN" ]; then
            git push -u "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
          else
            git push -u origin "HEAD:$BRANCH"
          fi
          bash scripts/ci-land-bot-pr.sh "$BRANCH" "chore: sync contract schema snapshot"
