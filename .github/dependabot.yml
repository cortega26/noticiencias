version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '08:00'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    rebase-strategy: 'disabled'
    commit-message:
      prefix: 'chore'
      include: 'scope'
  - package-ecosystem: 'npm'
    directory: '/workers'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '08:30'
      timezone: 'UTC'
    open-pull-requests-limit: 3
    rebase-strategy: 'disabled'
    commit-message:
      prefix: 'chore'
      include: 'scope'
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    rebase-strategy: 'disabled'
    commit-message:
      prefix: 'chore'
      include: 'scope'
